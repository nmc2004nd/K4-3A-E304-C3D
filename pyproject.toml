[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "classroom-summary-bot"
version = "0.1.0"
description = "Hybrid Discord classroom activity summary bot"
requires-python = ">=3.11"
dependencies = [
  "alembic>=1.13,<2",
  "apscheduler>=3.10,<4",
  "asyncpg>=0.29,<1",
  "discord.py>=2.4,<3",
  "httpx>=0.27,<1",
  "pydantic>=2.8,<3",
  "pydantic-settings>=2.4,<3",
  "redis>=5,<6",
  "sqlalchemy[asyncio]>=2.0,<3",
]

[project.optional-dependencies]
dev = [
  "mypy>=1.11,<2",
  "pytest>=8,<9",
  "pytest-asyncio>=0.24,<1",
  "ruff>=0.6,<1",
]

[project.scripts]
classroom-bot = "classroom_summary.main:main"
classroom-scheduler = "classroom_summary.scheduler_main:main"
classroom-healthcheck = "classroom_summary.health:main"

[tool.hatch.build.targets.wheel]
packages = ["src/classroom_summary"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]
